<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Bridge Load Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-3xl font-bold text-slate-800 mb-2 flex items-center gap-2">
    🌉 Paper Bridge Load Simulator
  </h1>
  <p class="text-gray-500 mb-6 text-sm">紙の橋の耐荷重をシミュレーション。パラメータを入力して最大積載重量を見積もります。</p>

  <!-- Input Form -->
  <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
    <h2 class="text-xl font-semibold text-slate-700 mb-4">橋のパラメータ</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label for="span" class="block text-sm font-medium text-gray-700 mb-1">スパン (cm)</label>
        <input id="span" type="number" min="5" max="100" value="20" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400">
        <p class="text-xs text-gray-400 mt-1">5〜100 cm</p>
      </div>
      <div>
        <label for="sheets" class="block text-sm font-medium text-gray-700 mb-1">紙の枚数</label>
        <input id="sheets" type="number" min="1" max="20" value="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400">
        <p class="text-xs text-gray-400 mt-1">1〜20 枚</p>
      </div>
      <div>
        <label for="fold" class="block text-sm font-medium text-gray-700 mb-1">折り方</label>
        <select id="fold" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400">
          <option value="Flat">Flat（平置き）</option>
          <option value="Folded" selected>Folded（折りたたみ）</option>
          <option value="Truss">Truss（トラス構造）</option>
        </select>
      </div>
    </div>
    <div class="mt-4">
      <label for="designName" class="block text-sm font-medium text-gray-700 mb-1">デザイン名</label>
      <input id="designName" type="text" class="w-full max-w-xs border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400" placeholder="例: 設計A">
    </div>
    <button onclick="calculate()" class="mt-4 bg-slate-700 hover:bg-slate-800 text-white font-semibold px-6 py-2 rounded-lg transition" aria-label="計算する">
      計算する
    </button>
  </div>

  <!-- Result -->
  <div id="result" class="hidden bg-white rounded-2xl shadow-md p-6 mb-6">
    <h2 class="text-xl font-semibold text-slate-700 mb-4">計算結果</h2>
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-50 rounded-xl p-4 text-center">
        <p class="text-sm text-gray-500">構造強度スコア</p>
        <p id="strengthScore" class="text-4xl font-bold text-slate-800"></p>
        <p id="strengthGrade" class="text-sm font-medium mt-1"></p>
      </div>
      <div class="bg-blue-50 rounded-xl p-4 text-center">
        <p class="text-sm text-gray-500">推定最大積載重量</p>
        <p id="maxLoad" class="text-4xl font-bold text-blue-800"></p>
        <p class="text-sm text-gray-400 mt-1">グラム</p>
      </div>
    </div>
    <div id="explanation" class="mt-4 p-4 bg-gray-50 rounded-xl text-sm text-gray-600"></div>
    <button onclick="saveDesign()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg transition" aria-label="比較表に保存">
      比較表に保存
    </button>
  </div>

  <!-- Comparison Table -->
  <div class="bg-white rounded-2xl shadow-md p-6">
    <h2 class="text-xl font-semibold text-slate-700 mb-4">デザイン比較</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-200 text-gray-600">
            <th class="text-left py-2 pr-4">名前</th>
            <th class="text-right py-2 pr-4">スパン</th>
            <th class="text-right py-2 pr-4">枚数</th>
            <th class="text-left py-2 pr-4">折り方</th>
            <th class="text-right py-2 pr-4">強度</th>
            <th class="text-right py-2 pr-4">最大荷重</th>
            <th class="py-2"></th>
          </tr>
        </thead>
        <tbody id="designTable">
        </tbody>
      </table>
    </div>
    <p id="table-empty" class="text-gray-400 text-sm text-center py-4 hidden">まだ保存されたデザインがありません</p>
  </div>
</div>

<script>
const FOLD_MULTIPLIER = { Flat: 1.0, Folded: 2.8, Truss: 4.5 };
const FOLD_DESC = {
  Flat: '平置き: 最も弱い構造。紙がたわみやすい。',
  Folded: '折りたたみ: 断面係数が向上し強度3倍程度。',
  Truss: 'トラス構造: 荷重を分散する最強の構造形式。'
};

let lastResult = null;

function calcStrength(span, sheets, fold) {
  const foldMult = FOLD_MULTIPLIER[fold];
  // スパンが長いほど弱くなる（二乗に反比例）
  const spanFactor = Math.max(0.1, 25 / (span * span / 10));
  const score = Math.round(sheets * foldMult * spanFactor * 100) / 10;
  const maxLoad = Math.round(sheets * foldMult * spanFactor * 120);
  return { score, maxLoad };
}

function gradeFromScore(score) {
  if (score >= 15) return { label: 'S級', color: 'text-yellow-600' };
  if (score >= 10) return { label: 'A級', color: 'text-green-600' };
  if (score >= 6) return { label: 'B級', color: 'text-blue-600' };
  if (score >= 3) return { label: 'C級', color: 'text-orange-500' };
  return { label: 'D級', color: 'text-red-500' };
}

function calculate() {
  const span = parseInt(document.getElementById('span').value) || 20;
  const sheets = parseInt(document.getElementById('sheets').value) || 1;
  const fold = document.getElementById('fold').value;

  const { score, maxLoad } = calcStrength(span, sheets, fold);
  const grade = gradeFromScore(score);

  document.getElementById('strengthScore').textContent = score;
  document.getElementById('strengthScore').className = 'text-4xl font-bold ' + grade.color;
  document.getElementById('strengthGrade').textContent = grade.label;
  document.getElementById('strengthGrade').className = 'text-sm font-medium mt-1 ' + grade.color;
  document.getElementById('maxLoad').textContent = maxLoad + 'g';

  const expEl = document.getElementById('explanation');
  expEl.textContent = FOLD_DESC[fold] + ' スパン' + span + 'cmに紙' + sheets + '枚。構造強度スコア=' + score;

  lastResult = { span, sheets, fold, score, maxLoad };
  document.getElementById('result').classList.remove('hidden');
}

function saveDesign() {
  if (!lastResult) return;
  const name = document.getElementById('designName').value.trim() || '設計' + (getDesigns().length + 1);
  const designs = getDesigns();
  designs.push({ ...lastResult, name, id: Date.now() });
  saveDesigns(designs);
  renderTable();
}

function getDesigns() {
  try { return JSON.parse(localStorage.getItem('bridgeDesigns') || '[]'); } catch(e) { return []; }
}
function saveDesigns(d) {
  localStorage.setItem('bridgeDesigns', JSON.stringify(d));
}
function deleteDesign(id) {
  saveDesigns(getDesigns().filter(d => d.id !== id));
  renderTable();
}

function renderTable() {
  const designs = getDesigns();
  const tbody = document.getElementById('designTable');
  const empty = document.getElementById('table-empty');
  tbody.innerHTML = '';

  if (designs.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  const maxScore = Math.max(...designs.map(d => d.score));

  designs.forEach(d => {
    const tr = document.createElement('tr');
    tr.className = 'border-b border-gray-100 hover:bg-gray-50';

    const grade = gradeFromScore(d.score);
    const isBest = d.score === maxScore;

    const addTd = (content, cls = 'py-2 pr-4') => {
      const td = document.createElement('td');
      td.className = cls;
      td.textContent = content;
      tr.appendChild(td);
      return td;
    };

    const nameTd = addTd(d.name + (isBest ? ' 🏆' : ''));
    nameTd.className = 'py-2 pr-4 font-medium ' + (isBest ? 'text-yellow-700' : '');
    addTd(d.span + 'cm', 'py-2 pr-4 text-right');
    addTd(d.sheets + '枚', 'py-2 pr-4 text-right');
    addTd(d.fold, 'py-2 pr-4');

    const scoreTd = document.createElement('td');
    scoreTd.className = 'py-2 pr-4 text-right font-bold ' + grade.color;
    scoreTd.textContent = d.score + ' (' + grade.label + ')';
    tr.appendChild(scoreTd);

    addTd(d.maxLoad + 'g', 'py-2 pr-4 text-right');

    const delTd = document.createElement('td');
    delTd.className = 'py-2';
    const delBtn = document.createElement('button');
    delBtn.className = 'text-gray-300 hover:text-red-400 transition';
    delBtn.textContent = '×';
    delBtn.setAttribute('aria-label', d.name + 'を削除');
    delBtn.onclick = () => deleteDesign(d.id);
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);

    tbody.appendChild(tr);
  });
}

renderTable();
</script>
</body>
</html>
